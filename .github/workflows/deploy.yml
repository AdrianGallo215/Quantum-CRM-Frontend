# ⚠️ ESTE NO ES EL DESPLIEGUE VIGENTE (auditoría 2026-08-13).
# Producción se sirve desde **Vercel**, y las cabeceras de seguridad reales
# (CSP, HSTS, X-Frame-Options…) las emite `vercel.json` — verificado en vivo
# contra https://crm.quantuminvest.com.pe. La imagen Docker + nginx de este
# workflow se mantiene como plan de contingencia, pero NO sirve tráfico.
# Si cambias la CSP, hazlo en `vercel.json` PRIMERO; `nginx.conf.template` es
# una copia que hay que mantener sincronizada a mano.
#
# Despliegue automático: en cada push a `main` se construye la imagen Docker y
# se publica en GitHub Container Registry (ghcr.io), etiquetada con el SHA del
# commit y con `latest`.
#
# El SHA es lo que hace posible el rollback: para volver atrás basta con
# redesplegar la etiqueta del commit anterior, sin reconstruir nada.
#
# Configuración necesaria en el repositorio (Settings → Secrets and variables):
#   Variables:  VITE_API_BASE_URL           (p. ej. https://api.tu-dominio.com/api/v1)
#               VITE_COTIZADOR_URL          (opcional; vacío = URL por defecto)
#               VITE_COTIZADOR_LEASING_URL  (opcional; vacío = URL por defecto)
# GITHUB_TOKEN es automático — no hay que crearlo.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

concurrency:
  # Dos despliegues simultáneos podrían publicar `latest` en orden invertido.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Mínimo por defecto para todo el workflow; `publicar` amplía a `packages: write`.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verificar:
    name: Verificaciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `ci` y no `install`: respeta el lockfile exacto y falla si está desincronizado.
      - name: Instalar dependencias
        run: npm ci

      - name: Comprobación de tipos
        run: npm run type-check

      # GATE REAL sobre lo que llega al navegador del usuario.
      # `--omit=dev` es deliberado: las vulnerabilidades de Vite, esbuild o
      # PostCSS afectan a la máquina del desarrollador, no al bundle desplegado.
      # Un gate que falla por ellas acaba desactivado, y entonces no protege nada.
      - name: Auditoría de dependencias de producción (BLOQUEANTE)
        run: npm audit --audit-level=high --omit=dev

      # Informativo: incluye devDependencies. No bloquea, pero deja el estado en
      # el log para que las vulnerabilidades de tooling no pasen inadvertidas.
      - name: Auditoría completa incl. desarrollo (informativo)
        run: npm audit --audit-level=high || true

      # El build es el último gate de DEVOPS-frontend.md §4: detecta fallos de
      # empaquetado que `tsc --noEmit` no ve.
      - name: Build de producción
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.quantuminvest.com.pe/api/v1

  publicar:
    name: Construir y publicar imagen
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Autenticarse en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Caché en el propio registro: sin esto, cada despliegue reinstala
          # node_modules desde cero.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_COTIZADOR_URL=${{ vars.VITE_COTIZADOR_URL }}
            VITE_COTIZADOR_LEASING_URL=${{ vars.VITE_COTIZADOR_LEASING_URL }}

      - name: Resumen
        run: |
          echo "### Imagen publicada" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
